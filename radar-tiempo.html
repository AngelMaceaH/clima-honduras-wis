    <!-- ICONOS -->

    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>

    <!-- CSS propio -->
    <link rel="stylesheet" href="css/estilo.css">
    <link rel="stylesheet" href="css/radar-tiempo.css">
  </head>

  <body>
  <!--NAVEGADOR-->
    <div class="container">
      <div class="navigation">
        <ul>
          <li>
            <a href="index.html">
              <span class="icon">
                <img src="img/logo/logo.png" alt="Logo" style="width: 200px; height: 50px; object-fit: contain;">
              </span>
            </a>
          </li>
          <li>
                    <a href="index.html">
                        <span class="icon">
                            <ion-icon name="cloudy-night-outline"></ion-icon>
                        </span>
                        <span class="title">Hoy</span>
                    </a>
                </li>

                <li>
                    <a href="pronóstico-diario.html">
                        <span class="icon">
                            <ion-icon name="today-outline"></ion-icon>
                        </span>
                        <span class="title">Diario</span>
                    </a>
                </li>

                <li>
                    <a href="radar-tiempo.html">
                        <span class="icon">
                            <ion-icon name="radio-outline"></ion-icon>
                        </span>
                        <span class="title">Radar</span>
                    </a>
                </li>

                <li>
                    <a href="semana.html">
                        <span class="icon">
                           <ion-icon name="cloud-circle-outline"></ion-icon>
                        </span>
                        <span class="title">Semanal</span>
                    </a>
                </li>

                <li>
                    <a href="ciclo-lunar.html">
                        <span class="icon">
                            <ion-icon name="moon-outline"></ion-icon>
                        </span>
                        <span class="title">Ciclo Lunar</span>

                </li>

                 <li>
                    <a href="noticias.html">
                        <span class="icon">
                           <ion-icon name="thunderstorm-outline"></ion-icon>
                        </span>
                        <span class="title">Noticias </span>
                    </a>
                </li>

                
                 <li>
                    <a href="acerca-de.html">
                        <span class="icon">
                           <ion-icon name="people-circle-outline"></ion-icon>
                        </span>
                        <span class="title">Nosotros </span>
                    </a>
                </li>
            </ul>
      </div>
    </div>

    <div class="main">
      <div class="topbar">
        <div class="toggle">
          <ion-icon name="menu-outline"></ion-icon>
        </div>

        <!-- Theme Switcher -->
        <div class="theme-switcher">
          <button id="theme-btn" class="btn btn-sm btn-theme dropdown-toggle" type="button" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="ri-contrast-2-line me-1"></i>
            <span id="current-theme">Light</span>
          </button>
          <ul class="dropdown-menu dropdown-menu-end">
            <li><a class="dropdown-item" href="#" data-theme="light"><i class="ri-sun-line me-2"></i>Light</a></li>
            <li><a class="dropdown-item" href="#" data-theme="dark"><i class="ri-moon-line me-2"></i>Dark</a></li>
          </ul>
        </div>
      </div>

      <main class="radar-page">
        <div class="content">
          <header class="radar-header">
            <h1 class="radar-title">Radar Meteorológico del Mundo</h1>
            <p class="radar-sub">Radar global en tiempo real</p>
          </header>

          <!-- BUSCADOR -->
          <div class="search-bar">
            <input type="text" id="searchInput" placeholder="Buscar ciudad, país…" />
            <button id="searchBtn">Buscar</button>
          </div>

          <!-- CAPAS Y BOTONES -->
          <section class="radar-controls-box">
            <div class="layer-select">
              <label>Capas:</label>
              <select id="layerMode">
                <option value="rain">Lluvia</option>
                <option value="clouds">Nubes</option>
                <option value="storms">Tormentas eléctricas</option>
                <option value="temp">Temperatura</option>
              </select>
            </div>

            <button id="playBtn">⏳ Animar</button>
            <button id="themeBtn">🌙 Tema oscuro</button>
            <button id="locBtn">📌 Mi ubicación</button>
          </section>

          <div class="controls-row"></div>

          <div id="owm-info" style="text-align:center;margin-top:8px;color:#b00"></div>

          <!-- MAPA -->
          <section class="maps-wrap">
            <div id="map" class="map"></div>

            <div class="timeline-wrap">
              <button id="timeline-play" class="btn btn-light" style="border-radius:50%;width:48px;height:48px;">▶</button>
              <input id="timeline-slider" class="timeline-slider" type="range" min="0" max="100" value="100" />
              <div id="timeline-label" style="min-width:140px;text-align:center;font-size:0.95rem;color:#333;">Ahora</div>
            </div>
          </section>

          <footer class="radar-footer"><small>Datos del radar: OpenWeatherMap</small></footer>
        </div>
      </main>
    </div>

    <!-- SCRIPTS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
    <script src="js/radar-tiempo.js"></script>
    <script src="js/principal.js"></script>

    <!-- Theme Switcher Script -->
    <script>
      (function() {
        const themeBtn = document.getElementById('theme-btn');
        const currentThemeSpan = document.getElementById('current-theme');
        const themeOptions = document.querySelectorAll('[data-theme]');
        
        // Load saved theme or default to light
        const savedTheme = localStorage.getItem('theme') || 'light';
        applyTheme(savedTheme);
        
        // Theme option click handlers
        themeOptions.forEach(option => {
          option.addEventListener('click', (e) => {
            e.preventDefault();
            const theme = option.getAttribute('data-theme');
            applyTheme(theme);
            localStorage.setItem('theme', theme);
          });
        });
        
        function applyTheme(theme) {
          if (theme === 'dark') {
            document.body.classList.add('dark-theme');
            currentThemeSpan.textContent = 'Dark';
          } else {
            document.body.classList.remove('dark-theme');
            currentThemeSpan.textContent = 'Light';
          }
        }
      })();
    </script>
  </body>
</html>
